name: CI

on:
  push:
    branches: [main, 'temp/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, http]
    name: Portable ${{ matrix.layer }} tests (no browser or Linux service proof)
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium for required computed-geometry tests
        if: matrix.layer == 'unit'
        run: pnpm exec playwright install --with-deps chromium
      - name: Compile account-file helper (no native hosting qualification)
        if: matrix.layer == 'unit'
        run: node helpers/account-files/build.mjs --output "$RUNNER_TEMP/xpanel-account-files"
      - run: node scripts/test-suite.mjs ${{ matrix.layer }}

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  browser-shards:
    name: Chromium acceptance shard ${{ matrix.shard }}/3 (no hosting-service proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate complete browser coverage
        run: node scripts/browser-acceptance-runner.mjs --validate
      - name: Install the pinned Playwright Chromium and runner dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the isolated browser partition
        run: node scripts/toolchain.mjs node scripts/browser-acceptance-runner.mjs --shard=${{ matrix.shard }}/3 --run-id=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve the partition receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-receipt-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}/shard-${{ matrix.shard }}/partition-receipt.json
          if-no-files-found: error
          include-hidden-files: false

  browser-acceptance:
    name: Chromium authentication and interface acceptance (no hosting-service proof)
    needs: browser-shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser partition to succeed
        env:
          SHARDS_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARDS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Collect partition receipts without merging their paths
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-receipt-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: test-results/browser-receipts
          merge-multiple: false
      - name: Verify exact coverage, source identity and successful outcomes
        run: node scripts/browser-acceptance-runner.mjs --aggregate=test-results/browser-receipts --run-id=${{ github.run_id }}-${{ github.run_attempt }}

  qualification-prerequisites:
    if: github.event_name == 'workflow_dispatch'
    name: Read-only Linux prerequisite report (qualification not run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Report prerequisites without running native qualification
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { linuxProofPreflight } from './scripts/test-linux-preflight.mjs'
          const state = linuxProofPreflight()
          const result = { ...state, proof_executed: false, qualification: 'not_run' }
          console.log(`XPANEL_TEST_LAYER=${JSON.stringify(result)}`)
          console.log(`::notice::Native Linux qualification was not run. Prerequisite status: ${state.status}. A disposable root/systemd VM is required for qualification.`)
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Native Linux qualification: **NOT RUN**.\n\nPrerequisite status: **${state.status}**.\n\nThis job reports availability only; a successful report is not a passed Linux qualification.\n`)
          }
          NODE
