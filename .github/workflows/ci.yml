name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, http]
    name: Portable ${{ matrix.layer }} tests (no browser or Linux service proof)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-suite.mjs ${{ matrix.layer }}

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  browser-acceptance:
    name: Chromium authentication and interface acceptance (no hosting-service proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Playwright Chromium and runner dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise actual browser authentication and Arabic layout
        run: node scripts/toolchain.mjs pnpm test:browser
      - name: Exercise 18 synthetic UI states (no hosting-service proof)
        run: node scripts/toolchain.mjs node tests/browser/phase1-acceptance.mjs --output=test-results/phase1-ui-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Exercise navigation and responsive interaction contracts (synthetic data)
        run: node scripts/toolchain.mjs node tests/browser/navigation-acceptance.mjs --output=test-results/navigation-ui-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Exercise independent login surface visual contracts (synthetic data)
        run: node scripts/toolchain.mjs node tests/browser/login-surface-acceptance.mjs --output=test-results/login-ui-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Exercise 24 mail layout states (synthetic data, no delivery proof)
        run: node scripts/toolchain.mjs node tests/browser/mail-layout-acceptance.mjs --output=test-results/mail-layout-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Exercise 24 Accounts workflow states (synthetic API responses)
        run: node scripts/toolchain.mjs node tests/browser/accounts-acceptance.mjs --output=test-results/accounts-ui-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Exercise 96 technical-value and contained-table layout states (synthetic data)
        run: node scripts/toolchain.mjs node tests/browser/technical-values-acceptance.mjs --output=test-results/technical-values-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Exercise 24 resource-meter views and 264 component states (synthetic data)
        run: node scripts/toolchain.mjs node tests/browser/resource-usage-acceptance.mjs --output=test-results/resource-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Exercise interruptible shell overlay motion (synthetic data)
        run: node scripts/toolchain.mjs node tests/browser/shell-motion-acceptance.mjs --output=test-results/shell-motion-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Exercise shell motion partial-setup recovery (synthetic failure injection)
        run: node scripts/toolchain.mjs node tests/browser/shell-motion-exception-acceptance.mjs --output=test-results/shell-motion-exception-${{ github.run_id }}-${{ github.run_attempt }}

  qualification-prerequisites:
    if: github.event_name == 'workflow_dispatch'
    name: Read-only Linux prerequisite report (qualification not run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Report prerequisites without running native qualification
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { linuxProofPreflight } from './scripts/test-linux-preflight.mjs'
          const state = linuxProofPreflight()
          const result = { ...state, proof_executed: false, qualification: 'not_run' }
          console.log(`XPANEL_TEST_LAYER=${JSON.stringify(result)}`)
          console.log(`::notice::Native Linux qualification was not run. Prerequisite status: ${state.status}. A disposable root/systemd VM is required for qualification.`)
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Native Linux qualification: **NOT RUN**.\n\nPrerequisite status: **${state.status}**.\n\nThis job reports availability only; a successful report is not a passed Linux qualification.\n`)
          }
          NODE
