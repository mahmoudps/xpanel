name: Dependency audit

on:
  push:
    branches: [main, 'temp/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Pinned dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Resolve the frozen dependency graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit the complete dependency graph
        run: pnpm audit --audit-level=low --registry=https://registry.npmjs.org
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=low --registry=https://registry.npmjs.org
