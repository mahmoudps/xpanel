name: Bug report
description: Something in xPanel does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems must not be reported here — follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Ubuntu 22.04, Ubuntu 24.04, CentOS Stream 9, CentOS Stream 10, AlmaLinux, Rocky Linux, Development machine]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Logs or test output, with secrets removed.
      render: text
